name: CICD
on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:
    inputs:
      type:
        type: choice
        options:
          - Test
          - Deploy
      alert:
        type: boolean
        description: Alert To Discord

jobs:
  # 모든 경우 실행됨
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        
      - name: Checkout Action Module code
        uses: actions/checkout@v4
        with:
          repository: "lcqff/github-actions-module"
          path: ./actions-module

      - name: Create Cache Docker Image Directory
        run: mkdir -p ~/db-docker-image
        
      - name: Cache DB Docker Image
        id: db-docker-image
        uses: actions/cache@v3
        with:
          path: ~/db-docker-image
          key: db-docker-image-${{ runner.os }}

      - name: Configure AWS Credentials
        uses: ./actions-module/common/aws
        with:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_ARN }}

      # - name: Check Cache Hit
      #   run: |
      #     echo "Cache hit: ${{ steps.db-docker-image.outputs.cache-hit }}"

      - name: Pull DB Image From ECR
        if: steps.db-docker-image.outputs.cache-hit != 'true'
        uses: ./actions-module/common/container/image-pull
        with:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          CACHE_PATH: '~/db-docker-image'
          CACHE_NAME: 'soundflyer-db'
          IMAGE_NAME: 'soundflyer-dev'
          IMAGE_TAG: ${{ secrets.DB_TAG }}

      - name: Load Image
        run: |
          docker load -i ~/db-docker-image/soundflyer-db.tar
      
      - name: Check Docker Images 
        run: docker images

      - name: Create Docker Env and Docker Compose File
        uses: ./actions-module/common/container/env
        with:
          DOCKER_ENV: "${{ secrets.DOCKER_ENV }}\nECR_REGISTRY=${{ secrets.ECR_REGISTRY }}"
          DOCKER_COMPOSE: ${{ secrets.DOCKER_COMPOSE }}
          
      - name: Start Containers
        run: docker compose -p soundflyer up -d

      - name: Build & Test
        uses: ./actions-module/common/test/gradle
        with:
          JAVA_VERSION: 17
          GRADLE_VERSION: 8.5
          CURRENT_BRANCH:  ${{ github.ref }}
          JASYPT_KEY: ${{ secrets.JASYPT_KEY }}
      
      # - run: java -Djarmode=layertools -jar build/libs/MusicPlatform-0.0.1-SNAPSHOT.jar extract

      - name: Upload JAR as Artifact    
        if: github.event_name == 'push' || github.event.inputs.type == 'Deploy'
        uses: actions/upload-artifact@v4
        with:
          name: built-jar
          path: build/libs/MusicPlatform-0.0.1-SNAPSHOT.jar

  # push되거나 Deploy로 수동 트리거 되는 경우에 실행
  deploy:
    needs: [ test ]
    if: github.event_name == 'push' || github.event.inputs.type == 'Deploy'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      
    steps:
        - name: Download Built JAR
          uses: actions/download-artifact@v4
          with:
            name: built-jar
            path: build/libs

        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
            aws-region: ${{ secrets.AWS_REGION }}  
        
        - name: Upload JAR to S3
          run: |
            aws s3 mv --region ${{ secrets.AWS_REGION }} \
            build/libs/MusicPlatform-0.0.1-SNAPSHOT.jar \
            ${{ secrets.S3_DEV_BACK_LOCATION }}/${GITHUB_SHA::8}.jar
  
        - name: Deploy
          uses: appleboy/ssh-action@master
          with:
            host: ${{ secrets.SSH_HOST_DEV }} 
            username: ${{ secrets.SSH_USERNAME_DEV }} 
            port: ${{ secrets.SSH_PORT_DEV }} 
            key: ${{ secrets.SSH_KEY_DEV }} 
            envs: GITHUB_SHA
            script: |
              cd ~/soundflyer-infra/deploy 
              chmod +x ./deploy_back.sh                 
              sudo -E ./deploy_back.sh ${GITHUB_SHA::8} dev

  # Push시 실행
  discord_alert:
    if: github.event_name == 'push' || github.event.inputs.alert == 'true'
    needs: [ deploy ]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Get the most recent commit message
        id: get-commit-message
        run: |
          FULL_COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          COMMIT_MESSAGE=$(echo $FULL_COMMIT_MESSAGE | sed -n 's/.*#\([0-9]\+\).*/\1/p')
          echo "Commit message: $COMMIT_MESSAGE"
          echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_OUTPUT

      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@master
        with:
          args: 'The project ${{ steps.get-commit-message.outputs.COMMIT_MESSAGE }} has been deployed.'
