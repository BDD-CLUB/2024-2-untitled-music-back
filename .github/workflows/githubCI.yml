name: CI
on:
  push:
      branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      
    steps:
      - name: Cache DB Docker Image
        id: db-docker-image
        uses: actions/cache@v3
        with:
          path: ~/db-docker-image
          key: db-docker-image-${{ runner.os }}
          
      - name: Configure AWS Credentials
        if: steps.db-docker-image.outputs.cache-hit != 'true' 
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          
      - name: Login to ECR
        if: steps.db-docker-image.outputs.cache-hit != 'true' 
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Pull DB Image From ECR
        if: steps.db-docker-image.outputs.cache-hit != 'true' 
        env:
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
        run: |
          mkdir -p ~/db-docker-image
          docker pull ${{ steps.login-ecr.outputs.registry }}/soundflyer-dev:${{ secrets.DB_TAG }}
          docker save -o \
            ~/db-docker-image/soundflyer-db.tar \
            ${{ steps.login-ecr.outputs.registry }}/soundflyer-dev:${{ secrets.DB_TAG }} 

      - name: Load Image
        run: |
          docker load -i ~/db-docker-image/soundflyer-db.tar

      - name: Create Docker Env File
        run: |
          echo '${{ secrets.DOCKER_ENV }}' >> .env
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> .env
          
      - name: Create Docker Compose File
        run: |
          echo '${{ secrets.DOCKER_COMPOSE }}' >> docker-compose.yml

      - name: Start Containers
        run: docker compose -p soundflyer up -d
      
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Gradle Build & Test
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: build
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'ref/heads/develop' }}
        env:
          JASYPT_KEY: ${{ secrets.JASYPT_KEY }}
      - run: ls build/libs
